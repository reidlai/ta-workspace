$schema: 'https://moonrepo.dev/schemas/tasks.json'

fileGroups:
  sources:
    - 'src/**/*'
    - 'types/**/*'
    - '!**/sveltekit/dist/**'
    - '!**/.*/**'
    - '!**/storybook-static/**'
  tests:
    - 'tests/**/*'
    - '**/__tests__/**/*'

tasks:
  build:
    command: 'npm run build'
    inputs:
      - '@group(sources)'
    outputs:
      - 'dist/**'
      - 'build/**'

  test:
    command: 'npm run test'
    inputs:
      - '@group(tests)'
      - '@group(sources)'

  format:
    command: 'prettier --write --ignore-path $workspaceRoot/.prettierignore .'
    inputs:
      - '@group(sources)'
      - '!**/sveltekit/dist/**'
      - '!**/.*/**'
      - '!**/storybook-static/**'


  lint:
    command: 'npm run lint'
    inputs:
      - '@group(sources)'
      - '.eslintrc.*'
      - 'tsconfig.json'
      - '!**/sveltekit/dist/**'
      - '!**/.*/**'
      - '!**/storybook-static/**'
