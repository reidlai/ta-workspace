type: "application"
stack: "backend"
id: "go-server"

tasks:
  build:
    command: "go"
    args:
      - "build"
      - "-o"
      - "bin/go-server"
      - "."
    platform: "system"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    outputs:
      - "bin/go-server"
    options:
      mergeArgs: "replace"
      mergeInputs: "replace"
      mergeOutputs: "replace"
    deps:
      - "test"

  test:
    command: "go"
    args:
      - "test"
      - "."
      - "./cmd/..."
      - "./internal/..."
    platform: "system"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    options:
      runInCI: true
      mergeArgs: "replace"
      mergeInputs: "replace"


  start:
    command: "go run . api-server"
    env:
      TA_SERVER_LOG_LEVEL: "DEBUG"
      TA_SERVER_LOG_FORMAT: "text"
    local: true

  format:
    command: "goimports"
    args:
      - "-w"
      - "."
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "!**/.*/**"
    platform: "system"
    options:
      mergeArgs: "replace"
      mergeInputs: "replace"

  lint:
    command: "go"
    args:
      - "run"
      - "github.com/golangci/golangci-lint/cmd/golangci-lint@latest"
      - "run"
      - "-v"
      - "--allow-parallel-runners"
    inputs:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "!**/.*/**"
    options:
      mergeArgs: "replace"
      mergeInputs: "replace"
    platform: "system"

  docker-build:
    command: "../../scripts/docker-build-verify.sh ta-apiserver Dockerfile ../.."
    inputs:
      - "Dockerfile"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "/scripts/docker-build-verify.sh"
    deps:
      - "test"
      - "lint"
    options:
      cache: false
