services:
  ta-apiserver:
    image: ghcr.io/reidlai/ta-apiserver:latest
    ports:
      - "8080:8080"
    environment:
      - TA_SERVER_LOG_LEVEL=DEBUG
      - TA_SERVER_LOG_FORMAT=text

  ta-webserver:
    image: ghcr.io/reidlai/ta-webserver:latest
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_API_URL=http://ta-apiserver:8080
    depends_on:
      - ta-apiserver
