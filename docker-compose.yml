services:
  nats:
    image: nats:latest
    command: "-js"
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 5

  ta-goserver:
    image: ghcr.io/reidlai/ta-goserver:latest
    ports:
      - "8080:8080"
    environment:
      - TA_GOSERVER_SERVER_LOG_LEVEL=DEBUG
      - TA_GOSERVER_SERVER_LOG_FORMAT=json
      - TA_GOSERVER_SERVER_DEBUG=true
      - TA_GOSERVER_SERVER_SECURE=false
      - TA_GOSERVER_REST_HOST=0.0.0.0
      - TA_GOSERVER_REST_PORT=8080
      - TA_GOSERVER_RES_NATS_URL=nats://nats:4222
    depends_on:
      - nats
    # command: res-server start
    command: api-server start

  ta-webserver:
    image: ghcr.io/reidlai/ta-webserver:latest
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_API_URL=http://ta-goserver:8080
    depends_on:
      - ta-goserver
