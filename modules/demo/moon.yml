# https://moonrepo.dev/docs/config/project
id: 'demo'
language: "unknown" # Mixed/Polyglot

fileGroups:
  sveltekit: ["sveltekit/**/*", "!sveltekit/node_modules/**", "!sveltekit/dist/**", "**/.*/**"]

tasks:
  # Svelte Frontend
  sveltekit-dev:
    deps: ["demo-sveltekit:dev"]
    preset: "server"
    toolchain: "node"

  sveltekit-build:
    deps: ["demo-sveltekit:build"]
    toolchain: "node"

  sveltekit-sync:
    deps: ["demo-sveltekit:sync"]
    toolchain: "node"
    preset: "server"
    options:
      runInCI: true
      persistent: false

  sveltekit-check:
    deps: ["demo-sveltekit:check"]
    toolchain: "node"

  sveltekit-test:
    deps: ["demo-sveltekit:test"]
    toolchain: "node"

  sveltekit-lint:
    deps: ["demo-sveltekit:lint"]
    toolchain: "system"
    options:
      mergeInputs: 'replace'

  sveltekit-format:
    deps: ["demo-sveltekit:format"]
    toolchain: "system"
    inputs: ["moon.yml"]
    options:
      mergeInputs: 'replace'

  sveltekit-storybook:
    deps: ["demo-sveltekit:storybook"]
    toolchain: "node"
    preset: "server"

  # Composite Tasks
  build:
    command: 'echo "Building all components"'
    deps: ["sveltekit-build"]
    outputs: []
    toolchain: "system"
    options:
      mergeArgs: 'replace'
      mergeInputs: 'replace'
      mergeOutputs: 'replace'

  test:
    command: 'echo "Testing all components"'
    deps: ["sveltekit-test", "sveltekit-check"]
    toolchain: "system"
    options:
      mergeArgs: 'replace'

  lint:
    command: 'echo "Linting all components"'
    deps: ["sveltekit-lint"]
    toolchain: "system"
    inputs: ["moon.yml"]
    options:
      mergeArgs: 'replace'
      mergeInputs: 'replace'

  format:
    command: 'echo "Formatting all components"'
    deps: ["sveltekit-format"]
    toolchain: "system"
    inputs: ["moon.yml"]
    options:
      mergeArgs: 'replace'
      mergeInputs: 'replace'

  storybook:
    deps: ["sveltekit-storybook"]
    preset: "server"
    toolchain: "system"
