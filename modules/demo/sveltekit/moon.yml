$schema: "https://moonrepo.dev/schemas/project.json"
id: "demo-sveltekit"
# Force cache invalidation
type: "library"
stack: "frontend"

tasks:
  build:
    outputs: []
    options:
      mergeOutputs: "replace"

  dev:
    command: "vite dev"
    local: true

  storybook:
    command: "pnpm run story:dev"
    local: true

  sync:
    command: "svelte-kit sync"

  check:
    command: "svelte-check --tsconfig ./tsconfig.json"
    deps:
      - "sync"

  lint:
    command: "pnpm run lint"

  test:
    command: "vitest run"
    env:
      CACHE_BUST: "1"

  format:
    command: "prettier --plugin-search-dir . --write ."
