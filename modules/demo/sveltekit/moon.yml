$schema: "https://moonrepo.dev/schemas/project.json"
id: "demo-sveltekit"
# Force cache invalidation
layer: "library"
stack: "frontend"

tasks:
  build:
    command: "svelte-package"
    outputs:
      - "dist/**"

  dev:
    command: "vite dev"
    preset: "server"

  storybook:
    command: "pnpm run story:dev"
    preset: "server"

  sync:
    command: "svelte-kit sync"

  check:
    command: "svelte-check --tsconfig ./tsconfig.json"
    deps:
      - "sync"

  lint:
    command: "svelte-check --tsconfig ./tsconfig.json --output human"
    inputs:
      [
        "src/**/*",
        "!src/lib/api-client.ts",
        "!dist/**",
        "!storybook-static/**",
        "**/.*/**",
        "moon.yml",
      ]
    toolchain: node
    options:
      mergeArgs: "replace"
      mergeInputs: "replace"
    deps:
      - "sync"

  test:
    command: "vitest run"
    toolchain: node
    env:
      CACHE_BUST: "1"
    options:
      mergeArgs: "replace"

  format:
    command: "prettier --write --ignore-path ../../../.prettierignore ."
    inputs:
      [
        "src/**/*",
        "!src/lib/api-client.ts",
        "!dist/**",
        "!storybook-static/**",
        "**/.*/**",
        "moon.yml",
      ]
    toolchain: node
    options:
      mergeArgs: "replace"
