$schema: "https://moonrepo.dev/schemas/project.json"
id: "demo-ts"
type: "library"
stack: "frontend"

tasks:
  build:
    outputs:
      - "dist"
  lint:
    command: "eslint ."
    inputs: ["**/*", "!node_modules/**", "**/.*/**"]
    platform: node
    options:
      mergeArgs: "replace"
      mergeInputs: "replace"

  test:
    command: "vitest run"
    platform: node
    options:
      mergeArgs: "replace"

  format:
    command: "prettier --write --ignore-path ../../../.prettierignore ."
    inputs: ["**/*", "!node_modules/**", "**/.*/**"]
    platform: node
    options:
      mergeArgs: "replace"
      mergeInputs: "replace"
