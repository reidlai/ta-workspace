language: typescript
id: "module-workflow"
layer: "tool"
stack: "systems"

tasks:
  add-module:
    command: "tsx src/bin/module-workflow.ts add-module"
    description: "Add a new feature module from a git repository"
    toolchain: node

  rename-module:
    command: "tsx src/bin/module-workflow.ts rename-module"
    description: "Rename an existing module and refactor references"
    toolchain: node

  delete-module:
    command: "tsx src/bin/module-workflow.ts delete-module"
    description: "Delete a module and clean up references"
    toolchain: node

  build:
    command: "pnpm run build"
    toolchain: node
    options:
      mergeArgs: "replace"

  test:
    command: "pnpm run test"
    toolchain: node
    options:
      mergeArgs: "replace"

  lint:
    command: "pnpm run lint"
    toolchain: node
    inputs: ["**/*", "!node_modules/**", "**/.*/**"]
    options:
      mergeArgs: "replace"

  format:
    command: "prettier --write --ignore-path ../../.prettierignore ."
    toolchain: node
    inputs: ["**/*", "!node_modules/**", "**/.*/**"]
    options:
      mergeArgs: "replace"
